<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Student Bootcamp Manager | GoldenByte Coding Bootcamp</title>
    <!-- Colours: gold #D4AF37,black #0B0B0B,ivory #FFFFF0,white #FFFFFF.Font: Calibri.-->
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Calibri,Carlito,"Segoe UI",Arial,sans-serif;
        font-size: 11pt;
        background: #fffff0;
        color: #0b0b0b;
      }
      header {
        background: #0b0b0b;
        border-bottom: 4px solid #d4af37;
        padding: 24px 16px;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
      }
      h1 {
        margin: 0;
        color: #d4af37;
        font-size: 26px;
      }
      header p {
        margin: 6px 0 0;
        color: #fffff0;
      }
      main {
        padding: 24px 16px;
      }
      .card {
        background: #ffffff;
        border-top: 4px solid #d4af37;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        padding: 20px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .toolbar h2 {
        margin: 0;
        font-size: 18px;
      }
      button {
        font-family: inherit;
        font-size: 11pt;
        background: #0b0b0b;
        color: #d4af37;
        border: 1px solid #d4af37;
        border-radius: 8px;
        padding: 8px 16px;
        cursor: pointer;
      }
      button:hover {
        background: #d4af37;
        color: #0b0b0b;
      }
      #output {
        background: #0b0b0b;
        color: #fffff0;
        border-radius: 8px;
        padding: 16px;
        margin: 0;
        overflow-x: auto;
        font-family: Consolas,"Courier New",monospace;
        font-size: 10pt;
        line-height: 1.5;
        min-height: 300px;
        white-space: pre;
      }
      .gold {
        color: #d4af37;
        font-weight: bold;
      }
      .pass {
        color: #8fd18f;
      }
      .fail {
        color: #f08f8f;
      }
      footer {
        text-align: center;
        padding: 16px;
        color: #6b6b5f;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <h1>Student Bootcamp Manager</h1>
        <p>GoldenByte Coding Bootcamp.Register students,calculate results,process them and print the final report.</p>
      </div>
    </header>

    <main class="wrap">
      <div class="card">
        <div class="toolbar">
          <h2>Application output</h2>
          <button id="runAgainBtn">Run again</button>
        </div>
        <pre id="output"></pre>
      </div>
    </main>

    <footer>JavaScript Essentials 2,Module 4 | The same output appears in the browser console (F12) and in the terminal with node app.js</footer>

    <script>
      // This page shows the app's console output on screen as well.
      // I keep app.js exactly the same as the Node version and just "listen in" on console.log here.
      const outputBox = document.getElementById("output");
      const originalLog = console.log;

      console.log = function (...args) {
        originalLog.apply(console, args); // still logs to the real browser console too
        // Remove the terminal colour codes,they only make sense in a terminal.
        const text = args.join(" ").replace(/\x1b\[[0-9;]*m/g, "");
        const line = document.createElement("div");
        line.textContent = text; // textContent,not innerHTML,so no text can ever run as code
        if (text.includes("====")) {
          line.className = "gold";
        } else if (/\bPASS\b/.test(text) && !text.includes("FAIL")) {
          line.className = "pass";
        } else if (/\bFAIL\b/.test(text)) {
          line.className = "fail";
        }
        outputBox.appendChild(line);
      };

      document.getElementById("runAgainBtn").addEventListener("click", () => location.reload());
    </script>
    <script src="app.js"></script>
  </body>
</html>
